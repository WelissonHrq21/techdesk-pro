name: Promote Approved Release Images

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Final SemVer without v prefix, for example 1.2.0"
        required: true
        type: string
      release_commit:
        description: "Full 40-character commit SHA used by both approved images"
        required: true
        type: string
      api_digest:
        description: "Approved API digest (sha256:...)"
        required: true
        type: string
      frontend_digest:
        description: "Approved frontend digest (sha256:...)"
        required: true
        type: string
      dry_run:
        description: "Validate everything without creating final tags"
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: promote-release-images-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      RELEASE_COMMIT: ${{ inputs.release_commit }}
      API_DIGEST: ${{ inputs.api_digest }}
      FRONTEND_DIGEST: ${{ inputs.frontend_digest }}
      DRY_RUN: ${{ inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE: https://github.com/${{ github.repository }}
      LAB_MODE: "false"

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0

      - name: Validate release commit and CI
        run: bash .github/scripts/validate-release-commit.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate and promote approved manifests
        env:
          REGISTRY_OWNER: ${{ github.repository_owner }}
        run: bash .github/scripts/promote-release-images.sh
