name: Release Docker Images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Image version without v prefix"
        required: true
        default: "1.0.0"
      source_ref:
        description: "Git ref to build"
        required: true
        default: "v1.0.0"
      push_images:
        description: "Push images to GHCR"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve image metadata
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
            source_ref="${{ inputs.source_ref }}"
            push_images="${{ inputs.push_images }}"
          else
            version="${GITHUB_REF_NAME#v}"
            source_ref="${GITHUB_REF_NAME}"
            push_images="true"
          fi

          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "source_ref=${source_ref}" >> "$GITHUB_OUTPUT"
          echo "push_images=${push_images}" >> "$GITHUB_OUTPUT"
          echo "api_image=ghcr.io/${owner}/techdesk-pro-api" >> "$GITHUB_OUTPUT"
          echo "frontend_image=ghcr.io/${owner}/techdesk-pro-frontend" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.source_ref }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.meta.outputs.push_images == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push_images == 'true' }}
          tags: |
            ${{ steps.meta.outputs.api_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.api_image }}:v${{ steps.meta.outputs.version }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: ${{ steps.meta.outputs.push_images == 'true' }}
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ steps.meta.outputs.frontend_image }}:${{ steps.meta.outputs.version }}
            ${{ steps.meta.outputs.frontend_image }}:v${{ steps.meta.outputs.version }}
